/rides/{rideId}/drivers/notify:
  post:
    tags:
      - Driver Assignment
    summary: Send ride request to driver
    description: |
      Gửi thông tin chuyến đi đến tài xế được hệ thống lựa chọn.

      FR:
        - FR-02.3 Gửi yêu cầu đến tài xế

    parameters:
      - name: rideId
        in: path
        required: true
        schema:
          type: string
        example: "RIDE-001"

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - driverId
            properties:
              driverId:
                type: string
                example: "DRIVER-001"

    responses:
      '200':
        description: Ride request sent to driver successfully

      '404':
        description: Driver or ride not found
